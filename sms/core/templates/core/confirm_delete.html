{% extends 'base.html' %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="card border-danger mx-auto" style="max-width:520px"><div class="card-body">
  <h1 class="h4 text-danger"><i class="bi bi-exclamation-triangle"></i> Delete this record?</h1>
  <p class="mb-1"><strong>{{ object }}</strong></p>
  <p class="text-body-secondary">This also removes the login account and linked records (attendance, fees, marks). This cannot be undone.</p>
  <form method="post" class="d-flex gap-2">{% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button><a class="btn btn-outline-secondary" href="{{ back }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
